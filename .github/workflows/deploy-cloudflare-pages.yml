name: Deploy to Cloudflare Pages (KSCW account)

# kscw.ch + www.kscw.ch are served by the `kscw-web` project in the KSCW Cloudflare
# account. It is a Direct Upload project — Cloudflare cannot attach a git repo to it,
# ever — so push-to-deploy has to come from here. Without this workflow the apex goes
# stale silently while the old `kscw-website` project keeps building nothing anyone sees
# (that is exactly what happened between 10.08 and 11.08.2026).

on:
  push:
    branches: [prod, dev]
  workflow_dispatch:

# Never pull_request / pull_request_target — this repo is PUBLIC and that would expose
# CLOUDFLARE_API_TOKEN to fork PRs.

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # The full suite (build + unit + e2e) gates the deploy — dev previews included, so a
  # preview is never mistaken for a tested build. Only the two test-login secrets are
  # passed; inheriting all secrets would hand CLOUDFLARE_API_TOKEN to npm ci + Playwright.
  test:
    uses: ./.github/workflows/test.yml
    secrets:
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          DIRECTUS_URL: ${{ github.ref_name == 'prod' && 'https://directus.kscw.ch' || 'https://directus-dev.kscw.ch' }}
        # `npm run build`, NOT `npx astro build`: only the npm script runs the `prebuild`
        # hook (scripts/fetch-site-text.mjs), which bakes the admin's Seitentexte
        # overrides into the HTML. Without it src/generated/site-text.json stays at its
        # committed empty state and every live page ships the pre-edit German until the
        # browser overlay catches up. The hook never fails a build (it keeps the last
        # known overrides and exits 0); DIRECTUS_URL above steers it too.
        # kscw-web is a Direct Upload project — Cloudflare runs no build of its own.
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # KSCW club account. Not a secret — it appears in every dashboard URL.
          CLOUDFLARE_ACCOUNT_ID: 989cbb0f25ed3f11e417908694ef8da5
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set. It must be a KSCW-account token with Account · Cloudflare Pages · Edit."
            exit 1
          fi
          npx wrangler@4 pages deploy dist \
            --project-name=kscw-web \
            --branch='${{ github.ref_name }}' \
            --commit-hash='${{ github.sha }}'
