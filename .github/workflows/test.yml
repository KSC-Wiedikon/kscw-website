name: Test

# Runs on every push to dev and prod — but not from its own trigger: it is CALLED by
# deploy-cloudflare-pages.yml as the `test` job the deploy `needs:` (2026-09-28), so a
# commit that breaks the CSP / XSS / site-text regression tests never reaches the live
# site, and the suite runs once per push rather than twice. workflow_dispatch keeps a
# manual run possible.
on:
  workflow_call:
    secrets:
      TEST_ADMIN_EMAIL:
        required: false
      TEST_ADMIN_PASSWORD:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx astro build

      - name: Run unit tests
        run: npx vitest run

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test
        env:
          PB_TEST_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          PB_TEST_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
